<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="cb-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cb-shield" x1="12" y1="10" x2="52" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="cb-inner" x1="18" y1="16" x2="46" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="0.3" />
    </linearGradient>
    <filter id="cb-glow" x="6" y="6" width="52" height="52" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle rounded background -->
  <rect width="64" height="64" rx="16" fill="url(#cb-bg)" />
  <rect width="64" height="64" rx="16" stroke="#334155" stroke-width="1.5" />

  <!-- Outer Bunker Hexagon / Vault Shield -->
  <path d="M32 9 L49 19 L49 41 L32 53 L15 41 L15 19 Z" 
        fill="url(#cb-shield)" 
        stroke="#60A5FA" 
        stroke-width="1.5" 
        stroke-linejoin="round"
        filter="url(#cb-glow)" />

  <!-- Forward Crew Chevron (Apex) -->
  <path d="M32 16 L43 23 L32 30 L21 23 Z" 
        fill="url(#cb-inner)" 
        stroke="#FFFFFF" 
        stroke-width="1"
        stroke-linejoin="round" />

  <!-- Lower Bunker Fort Foundation Pillars -->
  <path d="M22 34 L32 28 L42 34 L42 45 L32 50 L22 45 Z" 
        fill="#0F172A" 
        fill-opacity="0.55"
        stroke="#93C5FD" 
        stroke-width="1.2" 
        stroke-linejoin="round" />

  <!-- Center Dispatch Beacon Core -->
  <circle cx="32" cy="39" r="3" fill="#38BDF8" />
  <circle cx="32" cy="39" r="1.2" fill="#FFFFFF" />
</svg>
